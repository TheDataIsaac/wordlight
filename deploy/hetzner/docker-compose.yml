# Wordlight web studio, static files only. Reachable only through the edge proxy on the shared "web" network;
# no ports are published on the host.
name: wordlight

services:
  wordlight-web:
    image: caddy@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    container_name: wordlight-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:size=8m
      - /config:size=1m
    volumes:
      - ./current/dist:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # The caddy binary in the official image carries the bind-service file capability, so that one is kept;
    # everything else is dropped. Port 8080 itself needs no privilege.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    networks:
      - web

networks:
  web:
    external: true
