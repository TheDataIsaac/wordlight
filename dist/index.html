<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203e36">
<meta name="description" content="Scripture, songs, slides and graphics for church services, with outputs for OBS and screens.">
<meta name="application-name" content="Wordlight · Church Media">
<title>Wordlight · Church Media</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23203e36'/%3E%3Cpath d='M14 18q10-4 18 2 8-6 18-2v28q-10-4-18 2-8-6-18-2zM32 20v28' fill='none' stroke='%23e7c689' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css"></head><body>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<dialog id="helpDialog" aria-labelledby="helpTitle"><div class="dialog-top"><span class="eyebrow">OUTPUTS</span><button class="icon-button" data-action="close-help" aria-label="Close setup">×</button></div><h2 id="helpTitle">OBS &amp; screens</h2><div id="helpContent"></div></dialog>
<dialog id="showsDialog" class="wide-dialog" aria-labelledby="showsTitle"></dialog>
<dialog id="organizeDialog" class="wide-dialog" aria-labelledby="organizeTitle"></dialog>
<dialog id="timerDialog" aria-labelledby="timerTitle"></dialog>
<dialog id="lowerDialog" aria-labelledby="lowerTitle"></dialog>
<dialog id="graphicsDialog" class="wide-dialog" aria-label="Graphics"></dialog>
<input type="file" id="graphicsFile" accept="image/png,image/jpeg,image/webp" hidden>
<dialog id="songDialog" class="wide-dialog" aria-labelledby="songDialogTitle"></dialog>
<input type="file" id="bibleImportFile" accept=".fsb,.txt,.vpl,.zip,.json" hidden>
<input type="file" id="songLibraryFile" accept=".json,application/json" hidden>
<input type="file" id="songFile" accept=".json,.show,application/json" hidden>
<dialog id="versionsDialog" class="wide-dialog" aria-labelledby="versionsTitle"></dialog>
<dialog id="pickerDialog" class="wide-dialog picker-dialog" aria-label="Choose a passage"></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script type="module" src="app.js"></script></body></html>
